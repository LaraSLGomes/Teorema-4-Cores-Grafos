<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teorema das 4 Cores</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; margin: 0; }
        .container { display: flex; height: 100vh; }
        
        /* Lateral de controle */
        .sidebar { width: 350px; background: #252525; padding: 30px; box-shadow: 2px 0 10px rgba(0,0,0,0.5); z-index: 10; }
        h2 { color: #e67e22; border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        /* Botão estilizado */
        button { 
            width: 100%; padding: 15px; background: #e67e22; color: white; border: none; 
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px;
        }
        button:hover { background: #d35400; transform: scale(1.02); }

        /* Área do Mapa */
        .map-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #1a1a1a; }
        svg { width: 85%; height: auto; max-height: 90vh; }
        path { fill: #444; stroke: #1a1a1a; stroke-width: 1.5; transition: fill 0.6s ease; }
        path:hover { stroke: #fff; stroke-width: 2; opacity: 0.8; }

        .status-box { margin-top: 30px; padding: 15px; background: #333; border-radius: 5px; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>Trabalho Grafos</h2>
        <p>Implementação de algoritmo para as 27 UFs do Brasil.</p>
        <button onclick="rodarAlgoritmo()">COLORIR MAPA</button>

        <div class="status-box" id="log">
            Aguardando comando...
        </div>
    </div>

    <div class="map-area">
        <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
            <path id="RR" d="M220,40 L260,30 L280,80 L230,100 Z" />
            <path id="AP" d="M350,50 L390,60 L380,100 L340,90 Z" />

            <path id="TO" d="M380,250 L440,260 L430,380 L370,360 Z" />
            <path id="MA" d="M430,120 L500,140 L480,240 L430,230 Z" />
            <path id="PI" d="M490,160 L540,180 L520,280 L480,250 Z" />
            <path id="CE" d="M540,160 L590,170 L580,220 L530,210 Z" />
            <path id="RN" d="M585,175 L620,185 L615,205 Z" />
            <path id="PB" d="M580,210 L620,215 L615,235 Z" />
            <path id="PE" d="M530,220 L610,240 L600,270 L520,250 Z" />
            <path id="AL" d="M585,265 L610,275 L605,290 Z" />

            <path id="MS" d="M260,420 L350,430 L330,520 L240,500 Z" />
            <path id="MG" d="M430,410 L540,430 L520,530 L410,510 Z" />

            <path id="RS" d="M240,630 L300,640 L280,700 L220,680 Z" />
        </svg>
    </div>
</div>

<script>
    async function rodarAlgoritmo() {
        const log = document.getElementById('log');
        log.innerHTML = "Enviando requisição ao Python...";
        
        try {
            // Chama a API do Flask
            const response = await fetch('/executar_algoritmo');
            const cores = await response.json();
            
            // Aplica as cores no SVG
            for (const [uf, cor] of Object.entries(cores)) {
                const estadoPath = document.getElementById(uf);
                if (estadoPath) {
                    estadoPath.style.fill = cor;
                }
            }
            log.innerHTML = "<b>Sucesso!</b><br>Algoritmo guloso executado. Restrição de vizinhança obedecida.";
        } catch (e) {
            log.innerHTML = "Erro ao conectar com o servidor Flask.";
        }
    }
</script>

</body>
</html>
